<title>Paws Along the River — Intake</title>
<style>
:root{
  --bg:#f4f6f3; --card:#ffffff; --ink:#1f2a24; --muted:#66736c; --line:#e3e8e4;
  --brand:#2f7d5b; --brand-ink:#ffffff; --brand-soft:#e6f3ec;
  --warn:#b4651a; --warn-soft:#fdf1e4; --danger:#b23b3b; --danger-soft:#fbe9e9;
  --info:#2c6fae; --info-soft:#e7f0fa; --radius:14px; --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 20px rgba(20,30,25,.05);
}
*{box-sizing:border-box}
*{-webkit-tap-highlight-color:transparent}
button,.chip,.tab,.acard,.check,select,input[type=checkbox]{touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.app{display:flex;min-height:100vh}
nav.side{width:230px;background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.logo .paw{width:38px;height:38px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:20px}
.logo b{display:block;font-size:14px;line-height:1.15}
.logo small{color:var(--muted);font-size:12px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--ink)}
.navbtn:hover{background:#f1f5f2}
.navbtn.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.navbtn .ic{width:20px;text-align:center}
.side .spacer{flex:1}
.side .foot{font-size:12px;color:var(--muted);padding:8px 12px}
main{flex:1;min-width:0;padding:26px 32px;max-width:1240px}
html,body{overflow-x:hidden;max-width:100vw}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:24px;margin:0;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.sub{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:#f6f8f6}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{background:#286c4e}
.btn.danger{color:var(--danger);border-color:#efc9c9}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:14px}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}

label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;outline:none}
.in:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.in{min-height:80px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:999px;cursor:pointer;font-size:14px}
.chip.big{padding:12px 20px;font-size:16px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#eef1ee;color:#4a5750}
.tag.stray{background:var(--warn-soft);color:var(--warn)}
.tag.owner{background:var(--info-soft);color:var(--info)}
.tag.locked{background:var(--danger-soft);color:var(--danger)}
.tag.ok{background:var(--brand-soft);color:var(--brand)}
.tag.due{background:var(--warn-soft);color:var(--warn)}
.tag.overdue{background:var(--danger-soft);color:var(--danger)}
.animals{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.acard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;display:flex;gap:14px;box-shadow:var(--shadow);transition:transform .08s,border-color .08s}
.acard:hover{transform:translateY(-1px);border-color:#c9d6cd}
.avatar{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:var(--brand-soft);flex:none}
.avatar.cat{background:#f7eddc}.avatar.other{background:#e9e9f5}
.acard .nm{font-weight:700;font-size:17px;letter-spacing:-.01em}
.acard .meta{color:var(--muted);font-size:13px;margin-top:2px}
.acard .tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.empty .big{font-size:44px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.banner{padding:12px 14px;border-radius:12px;display:block;font-size:14px;line-height:1.5}
.banner.lock{background:var(--danger-soft);color:#7d2a2a;border:1px solid #f0cfcf}
.banner.info{background:var(--info-soft);color:#1f4f7d}
.banner.ok{background:var(--brand-soft);color:#235e45}
.hero{display:flex;gap:18px;align-items:center}
.hero .avatar{width:80px;height:80px;font-size:40px;border-radius:22px}
.hero .nm{font-size:28px;font-weight:800;letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px;cursor:pointer;background:#fff}
.check.done{background:var(--brand-soft);border-color:#cfe6d9}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.check .when{margin-left:auto;font-size:12px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(20,30,25,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:18px;width:100%;max-width:760px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{font-size:20px;margin-bottom:14px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{border:0;background:#f1f5f2;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:12px;color:var(--muted);text-align:center;font-weight:600;padding:4px}
.day{user-select:none;min-width:0;overflow:hidden;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff;font-size:12px}
.day.off{background:#f8faf8;color:#aab5ae}
.day.today{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.day .n{font-weight:700;margin-bottom:4px;display:inline-block;padding:0 5px;border-radius:6px}.day .n:hover{background:var(--brand-soft);color:var(--brand)}
.ev{display:block;padding:2px 6px;border-radius:6px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-size:11.5px}
.day .ev{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.ev.med{background:var(--info-soft);color:var(--info)}
.ev.vax{background:#efe6f8;color:#6a3fa5}
.ev.intake{background:var(--brand-soft);color:var(--brand)}
.ev.hold{background:var(--danger-soft);color:var(--danger)}
.ev.first{font-weight:700;border-left:3px solid currentColor}
.ev.done{opacity:.5;text-decoration:line-through}
.dose{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
.dose.given{background:var(--brand-soft);border-color:#cfe6d9}
.dose .d{font-weight:600;min-width:150px}
.dose .amt{font-size:18px;font-weight:800;color:var(--brand);min-width:90px}
.dose .lbl{color:var(--muted);font-size:13px;flex:1}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat .v{font-size:30px;font-weight:800;letter-spacing:-.02em}
.stat .l{color:var(--muted);font-size:13px}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.list-item:last-child{border-bottom:0}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1f2a24;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.ageSeg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ageSeg button{flex:1;border:0;background:#fff;padding:9px;cursor:pointer}
.ageSeg button.on{background:var(--brand);color:#fff}
.section{margin-bottom:22px}
.settings-row{display:grid;grid-template-columns:1fr 1fr 110px 110px auto;gap:8px;align-items:center;margin-bottom:6px}
.cal-list{display:none}
/* ---------- mobile ---------- */
nav.bottom{display:none}
.t-short,.filt-toggle,.only-m{display:none}
.camBadge{position:absolute;right:-6px;bottom:-6px;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:var(--brand);color:#fff;font-size:14px;display:grid;place-items:center;padding:0;cursor:pointer;line-height:1}
.ph{display:grid;place-items:center}
.quick{margin-top:10px}
.fmore{margin-top:10px}
.cal-day{padding:10px 0;border-bottom:1px solid var(--line)}
.cal-day:last-child{border-bottom:0}
.cal-day .cd{font-weight:700;margin-bottom:6px}
.cal-day .ev{white-space:normal;display:block;padding:6px 8px;font-size:13px}
body.modal-open{overflow:hidden}
@media screen and (max-width:900px){
  /* layout */
  .grid.cols-2,.grid.cols-3{grid-template-columns:1fr}
  .grid.cols-4{grid-template-columns:1fr 1fr}
  nav.side{display:none}
  main{padding:12px 14px calc(92px + env(safe-area-inset-bottom))}
  nav.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav.bottom button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 2px;border-radius:10px;min-height:52px}
  nav.bottom button .ic{font-size:22px}
  nav.bottom button.active{color:var(--brand);font-weight:600;background:var(--brand-soft)}
  h1{font-size:22px}
  .topbar{margin-bottom:12px;gap:10px}
  .hide-m{display:none!important}
  .only-m{display:inline-flex}
  /* tap targets + iOS zoom guard */
  .in,select.in{padding:12px;font-size:16px;min-height:46px}
  .btn{padding:11px 14px;min-height:44px;justify-content:center}
  .btn.sm{min-height:38px;padding:8px 12px}
  .chip{padding:10px 14px;min-height:42px}
  .check{padding:13px 12px}
  input[type=checkbox]{min-width:22px;min-height:22px}
  .dose input[type=checkbox]{width:26px!important;height:26px!important}
  .modal .chips .chip.big{padding:10px 16px;font-size:15px}
  /* animals list */
  .animals{grid-template-columns:1fr;gap:10px}
  .acard{padding:12px;gap:12px}
  .filt-toggle{display:inline-flex}
  .fmore{display:none}
  .fmore.open{display:block}
  .fcard{padding:12px;position:sticky;top:0;z-index:6}
  .fmore .row{flex-direction:column;align-items:stretch}
  .fmore .row .in{width:100%!important;min-width:0!important}
  /* animal page */
  .animal-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .animal-top .acts{display:contents}
  .animal-top .back{order:1;flex:1 1 55%}
  .animal-top .a-done{order:2;flex:1 1 35%}
  .animal-top .a-edit,.animal-top .a-print,.animal-top .a-del{order:3;flex:1 1 30%;min-width:0;padding-left:6px;padding-right:6px}
  .animal-top .tag.locked{order:4;flex-basis:100%;white-space:normal}
  .hero{gap:12px;align-items:flex-start}
  .hero .avatar{width:68px!important;height:68px!important;font-size:34px}
  .hero .nm{font-size:24px}
  .hero{flex-wrap:wrap}
  .hero > div:nth-child(2){flex:1 1 0;min-width:0}
  .hero > div:last-child{text-align:left;width:100%;flex-basis:100%}
  .hero > div:last-child .in{max-width:none}
  .tabs{position:sticky;top:0;z-index:8;background:var(--bg);margin:0 -14px 14px;padding:0 14px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .tab{padding:13px 14px;scroll-snap-align:center;min-height:46px}
  .t-full{display:none}.t-short{display:inline}
  .kv{grid-template-columns:105px 1fr}
  /* doses / schedule */
  .dose{flex-wrap:wrap;padding:12px;gap:8px 12px}
  .dose .d{min-width:0;flex:1}
  .dose .amt{min-width:0}
  .dose .lbl{flex-basis:100%;padding-left:38px}
  /* calendar */
  .cal{display:none}
  .cal-list{display:block}
  .stat .v{font-size:26px}
  .cfmore{display:none}
  .cfmore.open{display:block}
  .cfmore .row{flex-direction:column;align-items:stretch}
  .cfmore .row .in{width:100%!important}
  /* settings */
  .settings-row{grid-template-columns:1fr}
  .srow{flex-wrap:wrap;gap:8px}
  .srow > input.in:first-child{flex:1 1 100%!important;width:100%!important}
  .srow .in{min-width:0}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* full-screen forms with a pinned action bar */
  .modal-bg{padding:0;align-items:stretch}
  .modal{border-radius:0;max-width:100vw;min-height:100vh;padding:16px 16px 0;overflow-x:hidden}

.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--brand)}

}

let DB=load();
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.animals){d.settings=Object.assign(defaultSettings(),d.settings||{});d.settings.protocols=d.settings.protocols||defaultSettings().protocols;if(d.settings.vaccines&&d.settings.vaccines.cat)d.settings.vaccines.cat=d.settings.vaccines.cat.filter(v=>v.name!=='FeLV');
    if(!d.seeded){SEED_ANIMALS.forEach(x=>{if(!d.animals.some(a=>a.id===x.id))d.animals.push(JSON.parse(JSON.stringify(x)));});d.seeded=true;}
    return d;}}catch(e){}
  // first run on this computer: start with the shelter's current roster from Animals First (fully editable)
  return {animals:JSON.parse(JSON.stringify(SEED_ANIMALS)),settings:defaultSettings(),seeded:true};
}
function save(){try{if(typeof syScan==='function')syScan();}catch(e){}try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){alert('Storage is full — the browser could not save. Remove a few photos or export a backup and erase old records.');}}
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const todayStr=()=>fmtISO(new Date());
function fmtISO(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(iso,n){const d=parseISO(iso);d.setDate(d.getDate()+n);return fmtISO(d);}
function addMonths(iso,n){const d=parseISO(iso);d.setMonth(d.getMonth()+n);return fmtISO(d);}
function nice(iso){if(!iso)return '—';const d=parseISO(iso);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}
function niceShort(iso){const d=parseISO(iso);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function daysBetween(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000);}

function pickPhoto(target,cb){ // target: FORM or an animal record
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
    const max=800;let w=img.width,h=img.height;if(w>max||h>max){const k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k);}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    target.photo=c.toDataURL('image/jpeg',0.85);target.photoLocal=true;cb&&cb();};img.src=r.result;};r.readAsDataURL(f);};
  inp.click();
}
function photoHTML(a,cls,size){ if(!a.photo)return null;const s=sp(a.species);
  return `<div class="${cls} ph ${s.id==='cat'?'cat':s.main?'':'other'}" style="width:${size}px;height:${size}px;position:relative;overflow:hidden;flex:none">${s.icon}<img src="${esc(a.photo)}" alt="" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.remove()"></div>`; }

/* ====================== STRAY HOLD (48h) ====================== */
function holdEnds(a){ if(a.surrender!=='Stray'||a.species!=='dog')return null; /* PA stray hold applies to dogs only */ const t=new Date(a.intakeDate+'T'+(a.intakeTime||'12:00')); t.setHours(t.getHours()+48); return t; }
function isLocked(a){const e=holdEnds(a);return !!e && e>new Date();}
function holdText(a){const e=holdEnds(a);if(!e)return '';const ms=e-new Date();if(ms<=0)return 'Stray hold complete';const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000);return `Stray hold: ${h}h ${m}m remaining (until ${e.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})})`;}

/* ====================== VACCINE PLAN ====================== */
function isYoung(a){ // "puppy/kitten" = 3 months or younger
  if(a.birthday){return ageMonthsAt(a,a.intakeDate)<=3;}
  if(a.ageMode==='exact'&&a.ageValue){const v=parseFloat(a.ageValue);const months=a.ageUnit==='weeks'?v/4.345:a.ageUnit==='years'?v*12:v;return months<=3;}
  return a.ageStage==='baby';
}
function ageMonthsAt(a,iso){ // estimated age in months on a given date
  if(a.birthday){const bd=parseISO(a.birthday),d=parseISO(iso);return (d.getFullYear()-bd.getFullYear())*12+(d.getMonth()-bd.getMonth())+(d.getDate()-bd.getDate())/30.44;}
  if(!(a.ageMode==='exact'&&a.ageValue))return null;const v=parseFloat(a.ageValue);const m0=a.ageUnit==='weeks'?v/4.345:a.ageUnit==='years'?v*12:v;return m0+daysBetween(a.intakeDate,iso)/30.44;
}
function vaxStartDate(a){const he=holdEnds(a);return he?fmtISO(he):a.intakeDate;}
function buildVaxPlan(a){
  const proto=DB.settings.protocols[a.species];if(!proto||a.recordsProvided)return [];
  const start=vaxStartDate(a);const young=isYoung(a);const out=[];
  proto.items.forEach(it=>{
    const n=young?it.young:it.adult;
    for(let i=0;i<n;i++){
      let date=it.everyMonths?addMonths(start,i*it.everyMonths):addDays(start,i*(it.everyDays||0));
      let note='';
      if(it.minAgeMonths){
        const am=ageMonthsAt(a,date);
        if(am!==null&&am<it.minAgeMonths){ date=addDays(date,Math.ceil((it.minAgeMonths-am)*30.44)); note=`when ${it.minAgeMonths} months old`; }
        else if(am===null&&young){ note=`only once ${it.minAgeMonths} months or older — confirm age first`; }
      }
      out.push({id:uid(),name:it.name,date,label:n>1?`${it.name} · dose ${i+1} of ${n}`:it.name,note,given:null});
    }
  });
  return out.sort((x,y)=>x.date.localeCompare(y.date));
}
function ensureVaxPlan(a){ if(!a.vaxPlan||!a.vaxPlan.some(d=>d.given)) a.vaxPlan=buildVaxPlan(a); }

/* ====================== DOSING MATH ====================== */
function doseAmount(med,species,weight){const div=med.divisor[species];if(!div||!weight)return null;return Math.round(weight/div*100)/100;}
function buildPlan(med,startISO){
  const out=[];let cursor=startISO;let last=null;
  med.plan.forEach(step=>{
    if(step.gap){ cursor = step.gap.months? addMonths(last,step.gap.months) : addDays(last,step.gap.days||0); }
    for(let i=0;i<step.doses;i++){
      const date = i===0? cursor : addDays(last,step.everyDays||1);
      out.push({date,label:`${step.label} · dose ${i+1} of ${step.doses}`,given:null});
      last=date;
    }
    cursor=last;
  });
  return out;
}

function ageText(a){
  if(a.birthday){const bd=parseISO(a.birthday),n=new Date();let m=(n.getFullYear()-bd.getFullYear())*12+(n.getMonth()-bd.getMonth());if(n.getDate()<bd.getDate())m--;if(m<0)m=0;
    const t=m<12?`${m} mo`:`${Math.floor(m/12)} yr${m%12?' '+(m%12)+' mo':''}`;return `Age: ${t}${a.birthdayEst!==false?' (est.)':''}`;}
  if(a.ageMode==='exact'&&a.ageValue) return `Age: ${esc(a.ageValue)} ${a.ageUnit||''}`.trim();
  const st=STAGES.find(x=>x.id===a.ageStage); if(!st) return 'Age unknown';
  return st.id==='baby'? sp(a.species).young : st.label;
}
function dueItems(a){
  const t=todayStr();let overdue=0,today=0;
  (a.treatments||[]).forEach(tr=>tr.doses.forEach(d=>{if(!d.given){if(d.date<t)overdue++;else if(d.date===t)today++;}}));
  (a.vaccines||[]).forEach(v=>{if(v.nextDue&&!v.boosterDone&&!(a.vaxPlan||[]).some(p=>!p.given&&p.name===v.name)){if(v.nextDue<t)overdue++;else if(v.nextDue===t)today++;}});
  (a.vaxPlan||[]).forEach(p=>{if(!p.given){if(p.date<t)overdue++;else if(p.date===t)today++;}});
  return {overdue,today};
}

function promptWeight(){const a=A();const w=prompt('Current weight (lb):',a.weight||'');if(w===null)return;const n=parseFloat(w);if(!n){toast('Enter a number');return;}a.weight=n;a.weights=[...(a.weights||[]),{date:todayStr(),weight:n}];a.updatedAt=Date.now();render();toast('Weight updated — new treatments will use '+n+' lb');}

function vaxPlanHTML(a){
  if(!DB.settings.protocols[a.species])return '';
  const plan=a.vaxPlan||[];const young=isYoung(a);const start=vaxStartDate(a);
  const head=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">Vaccine plan</h2><button class="btn sm" onclick="rebuildVaxPlan()" title="Rebuild from current age, intake type and dates">↻ Rebuild</button></div>
   <div class="sub" style="margin-bottom:10px">${young?sp(a.species).young+' schedule (3 months or younger)':'Adult schedule'} · starts ${nice(start)}${holdEnds(a)?' (after 48h hold)':a.surrender==='Stray'?'':' (on intake)'}</div>`;
  if(a.recordsProvided)return `<div class="card" style="margin-bottom:14px">${head}<div class="banner info">Owner provided vaccination records — no plan created. Enter their prior vaccines below.</div></div>`;

   <div class="hint">Checking a dose records it in the history below with today's date. Doses of the same series shift if one is given late.</div></div>`;

function rebuildVaxPlan(){const a=A();if(a.vaxPlan&&a.vaxPlan.some(d=>d.given)&&!confirm('Some doses are already given. Rebuild anyway? Given doses stay in history.'))return;a.vaxPlan=buildVaxPlan(a);a.updatedAt=Date.now();render();toast('Plan rebuilt');}
function giveVaxDose(i,on){const a=A();const d=a.vaxPlan[i];
  if(on){ if(holdEnds(a)&&isLocked(a)&&!confirm('This dog is still on the 48-hour stray hold. Record the vaccine anyway?')){render();return;}
    d.given=todayStr();d.by=DB.staff||'';
    if(d.given!==d.date){const shift=daysBetween(d.date,d.given);a.vaxPlan.forEach(x=>{if(!x.given&&x.name===d.name&&x.date>=d.date)x.date=addDays(x.date,shift);});}
    const later=a.vaxPlan.filter(x=>x.name===d.name&&!x.given&&x.date>d.given).sort((x,y)=>x.date.localeCompare(y.date))[0];
    const def=(DB.settings.vaccines[a.species]||[]).find(v=>v.name===d.name);
    a.vaccines.forEach(v=>{if(v.name===d.name&&v.nextDue&&!v.boosterDone)v.boosterDone=true;});
    a.vaccines.push({id:uid(),planId:d.id,name:d.name,date:d.given,lot:'',by:d.by,nextDue:later?later.date:(def&&def.interval?addDays(d.given,def.interval):'')});
  } else { d.given=null;d.by='';a.vaccines=a.vaccines.filter(v=>v.planId!==d.id); }
  a.updatedAt=Date.now();render();}

function tabVaccines(a){

function addVaccine(){const a=A();const name=document.getElementById('vxName').value,date=document.getElementById('vxDate').value,lot=document.getElementById('vxLot').value,by=document.getElementById('vxBy').value,int=parseInt(document.getElementById('vxInt').value);
  // completing a booster for the same vaccine marks the earlier one done
  a.vaccines.forEach(v=>{if(v.name===name&&v.nextDue&&!v.boosterDone&&date>=v.date)v.boosterDone=true;});
  const planDose=(a.vaxPlan||[]).find(p=>!p.given&&p.name===name); if(planDose){planDose.given=date;planDose.by=by;}
  a.vaccines.push({id:uid(),planId:planDose?planDose.id:null,name,date,lot,by,nextDue:int?addDays(date,int):''});a.updatedAt=Date.now();render();toast('Vaccine recorded');}
function delVaccine(id){const a=A();const v=a.vaccines.find(x=>x.id===id);if(v&&v.planId){const p=(a.vaxPlan||[]).find(x=>x.id===v.planId);if(p){p.given=null;p.by='';}}a.vaccines=a.vaccines.filter(x=>x.id!==id);render();}
document.addEventListener('change',e=>{if(e.target.id==='vxName'){const a=A();const v=(DB.settings.vaccines[a.species]||[]).find(x=>x.name===e.target.value);if(v)document.getElementById('vxInt').value=v.interval;}});

document.addEventListener('change',e=>{if(e.target.id==='mdSel'){window._mdSel=e.target.value;}});
function medPreview(a,m){

  return `<div style="margin-top:10px"><label class="f">First dose date</label><input class="in" type="date" value="${start}" onchange="window._mdStart=this.value;render()" style="max-width:200px"></div>

  <h3 style="margin-top:12px">Schedule preview (${plan.length} doses)</h3>
  <div style="max-height:220px;overflow:auto">${plan.map(d=>`<div class="list-item"><span style="min-width:110px">${nice(d.date)}</span><span class="sub">${d.label}</span></div>`).join('')}</div>
  <button class="btn primary" style="margin-top:12px" ${amt==null?'disabled':''} onclick="startTreatment('${m.id}')">Start ${esc(m.name)}</button>`;

function startTreatment(medId){const a=A();const m=DB.settings.meds.find(x=>x.id===medId);const start=window._mdStart||todayStr();
  a.treatments.push({id:uid(),medId,medName:m.name,unit:m.unit,weight:a.weight,divisor:m.divisor[a.species],amount:doseAmount(m,a.species,a.weight),start,doses:buildPlan(m,start),notes:m.notes});
  a.checklist=a.checklist||{}; if(m.kind==='Dewormer'&&!a.checklist['Dewormer started'])a.checklist['Dewormer started']={date:todayStr(),by:DB.staff||''};
  a.updatedAt=Date.now();window._mdStart=null;render();toast(m.name+' started');}
function treatmentHTML(a,tr){
  const next=tr.doses.find(d=>!d.given);const allDone=!next;
  const stale=a.weight&&a.weight!==tr.weight;
  return `<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">${esc(tr.medName)}</h2><div class="sub">Started ${nice(tr.start)} · dosed at ${tr.weight} lb ÷ ${tr.divisor} = <b>${tr.amount} ${tr.unit}</b></div></div>
    <div class="row">${allDone?'<span class="tag ok">Complete</span>':`<span class="tag ${next.date<todayStr()?'overdue':next.date===todayStr()?'due':''}">Next: ${nice(next.date)}</span>`}<button class="btn sm" onclick="removeTreatment('${tr.id}')">Remove</button></div></div>
    ${stale?`<div class="banner lock" style="margin:10px 0">⚠️ Weight is now ${a.weight} lb (was ${tr.weight} lb). Current weight gives <b>${Math.round(a.weight/tr.divisor*100)/100} ${tr.unit}</b>. <button class="btn sm" onclick="recalc('${tr.id}')">Recalculate remaining doses</button></div>`:''}
    <div style="margin-top:12px">${tr.doses.map((d,i)=>`<div class="dose ${d.given?'given':''}"><input type="checkbox" style="width:18px;height:18px;accent-color:var(--brand)" ${d.given?'checked':''} onchange="giveDose('${tr.id}',${i},this.checked)"><span class="d">${nice(d.date)}</span><span class="amt">${d.amount||tr.amount} ${tr.unit}</span><span class="lbl">${d.label}${d.given?` · given ${nice(d.given)}${d.by?' by '+esc(d.by):''}`:d.date<todayStr()?' · <b style="color:var(--danger)">overdue</b>':''}</span></div>`).join('')}</div></div>`;
}
function giveDose(tid,i,on){const a=A();const tr=a.treatments.find(t=>t.id===tid);const d=tr.doses[i];
  if(on){d.given=todayStr();d.by=DB.staff||'';
    // if given on a different day than planned, shift the remaining doses so the gaps stay correct
    if(d.given!==d.date){const shift=daysBetween(d.date,d.given);for(let j=i;j<tr.doses.length;j++)tr.doses[j].date=addDays(tr.doses[j].date,shift);}
  } else {d.given=null;d.by='';}
  a.updatedAt=Date.now();render();}
function recalc(tid){const a=A();const tr=a.treatments.find(t=>t.id===tid);const amt=Math.round(a.weight/tr.divisor*100)/100;tr.doses.forEach(d=>{if(!d.given)d.amount=amt;});tr.weight=a.weight;tr.amount=amt;render();toast('Remaining doses recalculated');}
function removeTreatment(tid){if(!confirm('Remove this treatment and its schedule?'))return;const a=A();a.treatments=a.treatments.filter(t=>t.id!==tid);render();}

function upcomingFor(a){
  const out=[];
  (a.treatments||[]).forEach(tr=>tr.doses.forEach(d=>{if(!d.given)out.push({date:d.date,type:'med',text:`${tr.medName} — ${d.label}`,amount:(d.amount||tr.amount)+' '+tr.unit,animal:a});}));
  (a.vaccines||[]).forEach(v=>{if(v.nextDue&&!v.boosterDone&&!(a.vaxPlan||[]).some(p=>!p.given&&p.name===v.name))out.push({date:v.nextDue,type:'vax',text:`${v.name} due`,animal:a});});
  (a.vaxPlan||[]).forEach(p=>{if(!p.given)out.push({date:p.date,type:'vax',text:`Vaccine: ${p.label}${p.note?' ('+p.note+')':''}`,animal:a});});
  const he=holdEnds(a); if(he) out.push({date:fmtISO(he),type:'hold',text:'Stray hold ends',animal:a,done:he<new Date()});
  return out.sort((x,y)=>x.date.localeCompare(y.date));
}
function tabSchedule(a){const ev=upcomingFor(a);
  return `<div class="card" style="margin-bottom:14px"><h2>${esc(a.name)}'s calendar</h2>${calFilterHTML([a])}${monthHTML(ACAL,filterEvents(calEvents([a]),Object.assign({},CALF,{animal:'',species:''})),'navACal')}</div>

function calEvents(animals){
  const evs={};const add=(k,e)=>(evs[k]=evs[k]||[]).push(e);
  animals.forEach(a=>{(a.treatments||[]).forEach(tr=>tr.doses.forEach((d,i)=>{const n=tr.doses.length;add(d.given||d.date,{type:'med',name:tr.medName,done:!!d.given,start:i===0,cls:'med'+(d.given?' done':'')+(i===0?' first':''),t:`${i===0?'▶ ':''}${a.name}: ${tr.medName} ${d.amount||tr.amount}${tr.unit}${i===0?' START':' '+(i+1)+'/'+n}`,id:a.id,species:a.species,ref:{k:'dose',tr:tr.id,i},detail:(i===0?'First dose — series started · ':'Continuation · ')+d.label});}));
    (a.vaccines||[]).forEach(v=>{add(v.date,{type:'vax',name:v.name,done:true,cls:'vax done',t:`${a.name}: ${v.name} given`,id:a.id,species:a.species,ref:{k:'vaxrec',v:v.id},detail:v.planId?'from plan':'manual record'});if(v.nextDue&&!v.boosterDone&&!(a.vaxPlan||[]).some(p=>!p.given&&p.name===v.name))add(v.nextDue,{type:'vax',name:v.name,done:false,cls:'vax',t:`${a.name}: ${v.name} due`,id:a.id,species:a.species,ref:{k:'vaxdue',v:v.id},detail:'booster due'});});
    (a.vaxPlan||[]).forEach(p=>{if(!p.given){const series=a.vaxPlan.filter(x=>x.name===p.name).sort((x,y)=>x.date.localeCompare(y.date));const idx=series.indexOf(p);const first=idx===0;add(p.date,{type:'vax',name:p.name,done:false,start:first,cls:'vax'+(first?' first':''),t:`${first&&series.length>1?'▶ ':''}${a.name}: ${p.name}${series.length>1?(first?' START':' '+(idx+1)+'/'+series.length):''}`,id:a.id,species:a.species,ref:{k:'plan',p:p.id},detail:(series.length>1?(first?'First dose — series starts · ':'Continuation · '):'')+p.label+(p.note?' · '+p.note:'')});}});
    add(a.intakeDate,{type:'intake',name:'',done:false,cls:'intake',t:`Intake: ${a.name}${a.intakeTime?' '+fmtTime(a.intakeTime):''}`,id:a.id,species:a.species,ref:{k:'intake'},detail:a.surrender});
    const he=holdEnds(a);if(he)add(fmtISO(he),{type:'hold',name:'',done:he<new Date(),cls:'hold'+(he<new Date()?' done':''),t:`${a.name}: hold ends ${he.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}`,id:a.id,species:a.species,ref:{k:'hold'},detail:'48 h after intake'});});
  return evs;
}
function filterEvents(evs,f){
  const q=(f.q||'').trim().toLowerCase();const nameOf=id=>{const a=DB.animals.find(x=>x.id===id);return a?(a.name+' '+(a.breed||'')).toLowerCase():'';};
  const out={};Object.entries(evs).forEach(([k,list])=>{const l=list.filter(e=>(f.type==='all'||e.type===f.type)&&(!f.animal||e.id===f.animal)&&(!q||nameOf(e.id).includes(q))&&(!f.species||e.species===f.species)&&(!f.name||e.name===f.name)&&(f.showDone||!e.done));if(l.length)out[k]=l;});return out;
}
const CALF={type:'all',animal:'',species:'',name:'',q:'',showDone:false};
function calFilterHTML(animals){
  const types=[['all','All'],['med','Medications'],['vax','Vaccines'],['intake','Intakes'],['hold','Hold ends']];
  // count pending items per medication / vaccine across the shown animals
  const counts={};const bump=(k)=>counts[k]=(counts[k]||0)+1;
  animals.forEach(a=>{(a.treatments||[]).forEach(t=>t.doses.forEach(d=>{if(!d.given||CALF.showDone)bump('med:'+t.medName);}));
    (a.vaxPlan||[]).forEach(p=>{if(!p.given)bump('vax:'+p.name);});(a.vaccines||[]).forEach(v=>{if(CALF.showDone)bump('vax:'+v.name);});});

  let chips='';

    // show every configured med/vaccine for the species in view, even with 0 scheduled, so the list reads like a menu
    const configured=new Set();
    if(kind==='med')DB.settings.meds.forEach(m=>{if(!CALF.species||m.species.includes(CALF.species))configured.add(m.name);});
    else Object.entries(DB.settings.vaccines).forEach(([spid,list])=>{if(!CALF.species||spid===CALF.species)list.forEach(v=>configured.add(v.name));});
    Object.keys(counts).forEach(k=>{if(k.startsWith(kind+':'))configured.add(k.slice(4));});
    const names=[...configured].filter(Boolean).sort();
    const total=names.reduce((n,x)=>n+(counts[kind+':'+x]||0),0);
    const info=n=>{if(kind==='med'){const m=DB.settings.meds.find(x=>x.name===n);return m?m.kind:'';}return 'Vaccine';};
    chips=`<div class="chips" style="margin-bottom:12px"><button class="chip ${!CALF.name?'on':''}" onclick="CALF.name='';render()">All ${kind==='med'?'medications':'vaccines'} <span class="sub" style="${!CALF.name?'color:#dff0e6':''}">${total}</span></button>
      ${names.map(n=>`<button class="chip ${CALF.name===n?'on':''}" onclick="CALF.name='${esc(n).replace(/'/g,"\\'")}';render()">${kind==='med'?'💊':'💉'} ${esc(n)} <span class="sub" style="${CALF.name===n?'color:#dff0e6':''}">${counts[kind+':'+n]||0}</span></button>`).join('')}</div>
      ${CALF.name?`<div class="banner info" style="margin-bottom:12px">${medInfoHTML(kind,CALF.name)}</div>`:''}`;
  }

  const matchBar=q?`<div class="row" style="margin-bottom:10px"><span class="sub">${matches.length?'Showing:':'No animal matches “'+esc(CALF.q)+'”'}</span>${matches.map(a=>`<button class="chip" style="padding:5px 12px" onclick="openAnimal('${a.id}')">${sp(a.species).icon} ${esc(a.name)}</button>`).join('')}</div>`:'';
  return `<div class="tabs" style="margin-bottom:12px">${types.map(t=>`<button class="tab ${CALF.type===t[0]?'active':''}" onclick="CALF.type='${t[0]}';CALF.name='';render()">${t[1]}</button>`).join('')}</div>
  ${chips}
  <div class="row" style="margin-bottom:12px">
   ${multi?`<input class="in" id="calq" style="width:auto;min-width:190px;flex:1;max-width:280px" placeholder="🔍 Search animal name…" value="${esc(CALF.q||'')}" oninput="CALF.q=this.value;render();const i=document.getElementById('calq');i.focus();i.setSelectionRange(i.value.length,i.value.length)">
   <select class="in" style="width:auto;min-width:150px" onchange="CALF.animal=this.value;render()"><option value="">All animals</option>${animals.slice().sort((x,y)=>x.name.localeCompare(y.name)).map(a=>`<option value="${a.id}" ${CALF.animal===a.id?'selected':''}>${sp(a.species).icon} ${esc(a.name)}</option>`).join('')}</select>
   <select class="in" style="width:auto;min-width:140px" onchange="CALF.species=this.value;render()"><option value="">All species</option>${SPECIES.map(x=>`<option value="${x.id}" ${CALF.species===x.id?'selected':''}>${x.icon} ${x.name}</option>`).join('')}</select>`:''}
   <label class="row" style="gap:6px;cursor:pointer;font-size:14px"><input type="checkbox" style="width:17px;height:17px;accent-color:var(--brand)" ${CALF.showDone?'checked':''} onchange="CALF.showDone=this.checked;render()"> Show completed</label>
   <button class="btn sm" onclick="Object.assign(CALF,{type:'all',animal:'',species:'',name:'',q:'',showDone:false});render()">Clear</button>
   <div class="row" style="font-size:12px;margin-left:auto"><span class="ev med">Medication</span><span class="ev vax">Vaccine</span><span class="ev intake">Intake</span><span class="ev hold">Hold ends</span><span class="ev med first">START = first dose</span></div>
  </div>${matchBar}`;
}
function medInfoHTML(kind,name){
  if(kind==='med'){const m=DB.settings.meds.find(x=>x.name===name);if(!m)return `<b>${esc(name)}</b>`;
    const dv=Object.entries(m.divisor).map(([sp_,d])=>`${sp(sp_).name}: weight ÷ ${d}`).join(' · ');
    return `<b>💊 ${esc(m.name)}</b> <span class="tag">${m.kind}</span> — ${dv} → ${m.unit} per dose. ${esc(m.notes||'')}`;}
  const prot=Object.entries(DB.settings.protocols).map(([spid,pr])=>{const it=pr.items.find(x=>x.name===name);return it?`${sp(spid).name}: adult ×${it.adult}, ${sp(spid).young.toLowerCase()} ×${it.young}${it.everyMonths&&it.young>1?' ('+it.everyMonths+' mo apart)':''}${it.minAgeMonths?', '+it.minAgeMonths+'+ months old':''}`:''}).filter(Boolean).join(' · ');

function fmtTime(t){if(!t)return '';const [h,m]=t.split(':').map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}
function monthHTML(cal,evs,nav){
  const y=cal.getFullYear(),m=cal.getMonth();const startDow=new Date(y,m,1).getDay();const days=new Date(y,m+1,0).getDate();

}

function dayToggle(i,on){const e=dayEvent(i);const a=DB.animals.find(x=>x.id===e.id);
  if(e.ref.k==='dose'){const tr=a.treatments.find(t=>t.id===e.ref.tr);const d=tr.doses[e.ref.i];if(on){d.given=DAY;d.by=DB.staff||'';}else{d.given=null;d.by='';}}
  if(e.ref.k==='plan'){const idx=a.vaxPlan.findIndex(p=>p.id===e.ref.p);const saveCur=CUR;CUR=a.id;const p=a.vaxPlan[idx];
    if(on){p.given=DAY;p.by=DB.staff||'';const later=a.vaxPlan.filter(x=>x.name===p.name&&!x.given&&x.date>DAY).sort((x,y)=>x.date.localeCompare(y.date))[0];const def=(DB.settings.vaccines[a.species]||[]).find(v=>v.name===p.name);a.vaccines.forEach(v=>{if(v.name===p.name&&v.nextDue&&!v.boosterDone)v.boosterDone=true;});a.vaccines.push({id:uid(),planId:p.id,name:p.name,date:DAY,lot:'',by:p.by,nextDue:later?later.date:(def&&def.interval?addDays(DAY,def.interval):'')});}
    else{p.given=null;p.by='';a.vaccines=a.vaccines.filter(v=>v.planId!==p.id);}

function dayMove(i,newDate){if(!newDate||newDate===DAY)return;const e=dayEvent(i);const a=DB.animals.find(x=>x.id===e.id);const shift=daysBetween(DAY,newDate);
  if(e.ref.k==='dose'){const tr=a.treatments.find(t=>t.id===e.ref.tr);const d=tr.doses[e.ref.i];
    if(d.given){d.given=newDate;}else{const rest=tr.doses.slice(e.ref.i+1).filter(x=>!x.given);const all=rest.length&&confirm(`Also move the ${rest.length} later ${tr.medName} dose${rest.length>1?'s':''} by ${Math.abs(shift)} day${Math.abs(shift)>1?'s':''}?`);d.date=newDate;if(all)rest.forEach(x=>x.date=addDays(x.date,shift));}}
  else if(e.ref.k==='plan'){const p=a.vaxPlan.find(x=>x.id===e.ref.p);const rest=a.vaxPlan.filter(x=>x.name===p.name&&!x.given&&x.date>p.date);const all=rest.length&&confirm(`Also move the ${rest.length} later ${p.name} dose${rest.length>1?'s':''} by ${Math.abs(shift)} day${Math.abs(shift)>1?'s':''}?`);p.date=newDate;if(all)rest.forEach(x=>x.date=addDays(x.date,shift));}
  else if(e.ref.k==='vaxrec'){const v=a.vaccines.find(x=>x.id===e.ref.v);v.date=newDate;if(v.planId){const p=a.vaxPlan.find(x=>x.id===v.planId);if(p)p.given=newDate;}}
  else if(e.ref.k==='intake'){if(isLocked(a)&&!confirm('This dog is on the 48-hour stray hold. Changing the intake date also moves when the hold ends. Continue?'))return;a.intakeDate=newDate;if(!(a.vaxPlan||[]).some(x=>x.given))a.vaxPlan=buildVaxPlan(a);}

const ADOPT_TASKS=[['paperwork','Paperwork signed'],['fee','Fee collected'],['chip','Microchip registered'],['altered','Spay/neuter agreement'],['follow','2-week follow-up call']];
let HTAB='intakes',ADF='all',ADOPTF=null;
function renderHistory(){
  const tabs=`<div class="tabs" style="margin-bottom:12px"><button class="tab ${HTAB==='intakes'?'active':''}" onclick="HTAB='intakes';render()">📍 Intakes &amp; map</button><button class="tab ${HTAB==='out'?'active':''}" onclick="HTAB='out';render()">🏡 Adoptions &amp; outcomes</button></div>`;
  return HTAB==='out'?renderOutcomes(tabs):renderIntakesTab(tabs);
}
const monthKey=iso=>iso?iso.slice(0,7):'';
function lastMonths(n){const out=[];const d=new Date();d.setDate(1);for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push({k:x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'),m:x.toLocaleDateString(undefined,{month:'short'}),y:x.getFullYear(),jan:x.getMonth()===0});}return out;}
function adoptChart(){
  const narrow=window.innerWidth<700,ms=lastMonths(narrow?6:12);
  const inn=ms.map(m=>DB.animals.filter(a=>monthKey(a.intakeDate)===m.k).length);
  const ado=ms.map(m=>DB.animals.filter(a=>a.outcome==='Adopted'&&monthKey(a.outcomeDate)===m.k).length);
  const mx=Math.max(4,...inn,...ado);const top=Math.ceil(mx/4)*4;
  const W=narrow?380:640,H=250,L=34,R=10,T=18,B=40,pw=W-L-R,ph=H-T-B,slot=pw/ms.length,bw=Math.min(18,slot/2-3);
  const y=v=>T+ph-(v/top)*ph;
  let g='';
  for(let i=0;i<=4;i++){const v=top/4*i;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#dfe6e0" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#667">${v}</text>`;}
  ms.forEach((m,i)=>{
    const cx=L+slot*i+slot/2;
    [[inn[i],'#9db8d6',-bw-1],[ado[i],'#2f7d5b',1]].forEach(([v,c,dx])=>{
      if(v>0)g+=`<rect x="${cx+dx}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="3" fill="${c}"/><text x="${cx+dx+bw/2}" y="${y(v)-4}" text-anchor="middle" font-size="11" fill="#334">${v}</text>`;});
    g+=`<text x="${cx}" y="${H-22}" text-anchor="middle" font-size="12" fill="#334">${m.m}</text>`;
    if(i===0||m.jan)g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" fill="#889">${m.y}</text>`;
  });
  return `<div class="chartwrap" id="adoptChartWrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly intakes and adoptions">${g}</svg></div>
   <div class="legend"><span><i style="background:#9db8d6"></i>Came in</span><span><i style="background:#2f7d5b"></i>Adopted</span><span>Last ${ms.length} months</span></div>`;
}
function adoptStats(){
  const all=DB.animals,yr=String(new Date().getFullYear()),t=todayStr(),d30=addDays(t,-30);
  const ad=all.filter(a=>a.outcome==='Adopted');
  const days=ad.filter(a=>a.intakeDate&&a.outcomeDate).map(a=>daysBetween(a.intakeDate,a.outcomeDate));
  const avg=days.length?Math.round(days.reduce((x,y)=>x+y,0)/days.length):null;
  const due=ad.filter(a=>adoptFollowDue(a)).length;
  return [[all.filter(a=>!a.outcome).length,'In care now',''],[ad.filter(a=>(a.outcomeDate||'').startsWith(yr)).length,'Adopted this year',''],[ad.filter(a=>(a.outcomeDate||'')>=d30).length,'Adopted, last 30 days',''],[avg===null?'—':avg,'Avg days to adoption',''],[due,'Follow-ups due',due?'warn':'']];
}
function adoptFollowDue(a){if(a.outcome!=='Adopted'||!a.outcomeDate)return false;const t=(a.adopt||{}).tasks||{};return !t.follow&&todayStr()>=addDays(a.outcomeDate,14);}
function adoptDone(a){const t=((a.adopt||{}).tasks)||{};return ADOPT_TASKS.filter(k=>t[k[0]]).length;}

function adoptTask(id,k,on){const a=DB.animals.find(x=>x.id===id);if(!a)return;a.adopt=a.adopt||{who:{},fee:'',note:'',tasks:{}};a.adopt.tasks=a.adopt.tasks||{};a.adopt.tasks[k]=on?todayStr():null;a.updatedAt=Date.now();render();}

/* ================= SHARED SYNC (optional, offline-first) ================= */
const SYNC_DEFAULT={url:'https://rerrsetgnrbyaljnfpws.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlcnJzZXRnbnJieWFsam5mcHdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNTc3NDQsImV4cCI6MjEwNjgzMzc0NH0.WyTab9P6iKf9ESbnBzNLzlh3sBXWwkmBgPIoYFM1K18'};
const SKEY='patr_sync_v1';
let SY=(()=>{try{return Object.assign({url:'',key:'',session:null,profile:null,cursor:'',scursor:'',pushed:{},spushed:0},JSON.parse(localStorage.getItem(SKEY))||{});}catch(e){return {url:'',key:'',session:null,profile:null,cursor:'',scursor:'',pushed:{},spushed:0};}})();
let SYS={state:'idle',last:0,err:'',busy:false,team:null,authErr:'',authBusy:false,mode:'in'};
function syCfg(){return {url:(SY.url||SYNC_DEFAULT.url||'').replace(/\/+$/,''),key:SY.key||SYNC_DEFAULT.key||''};}
function syOn(){const c=syCfg();return !!(c.url&&c.key);}
function sySave(){try{localStorage.setItem(SKEY,JSON.stringify(SY));}catch(e){}}
function syRole(){return SY.profile?SY.profile.role:'';}
function syOK(){return syOn()&&SY.session&&(syRole()==='staff'||syRole()==='admin');}
async function syFetch(path,opt={}){
  const c=syCfg();const h=Object.assign({apikey:c.key,'Content-Type':'application/json'},opt.headers||{});
  if(SY.session&&!opt.noAuth)h.Authorization='Bearer '+SY.session.access_token;
  const r=await fetch(c.url+path,Object.assign({},opt,{headers:h}));
  return r;
}
async function syRefresh(){
  if(!SY.session||!SY.session.refresh_token)return false;
  try{const r=await syFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',noAuth:true,body:JSON.stringify({refresh_token:SY.session.refresh_token})});
    if(r.status===400||r.status===401||r.status===403){SY.session=null;SY.profile=null;sySave();return false;}
    if(!r.ok)return true;const j=await r.json();syTake(j);return true;}catch(e){return true;}
}
function syTake(j){SY.session={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+((j.expires_in||3600)-60)*1000,user:j.user?{id:j.user.id,email:j.user.email}:(SY.session&&SY.session.user)};sySave();}
async function syReq(path,opt){ // auto-refresh when token is near/after expiry
  if(SY.session&&Date.now()>SY.session.expires_at)await syRefresh();
  let r=await syFetch(path,opt);
  if(r.status===401&&SY.session){if(await syRefresh()&&SY.session)r=await syFetch(path,opt);}
  return r;
}
async function syAuth(mode,email,pass,name){
  SYS.authBusy=true;SYS.authErr='';syGate();
  try{
    let r;
    if(mode==='up')r=await syFetch('/auth/v1/signup',{method:'POST',noAuth:true,body:JSON.stringify({email,password:pass,data:{name:name||''}})});
    else r=await syFetch('/auth/v1/token?grant_type=password',{method:'POST',noAuth:true,body:JSON.stringify({email,password:pass})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.access_token){SYS.authErr=j.msg||j.error_description||j.message||j.error||(mode==='up'&&r.ok?'Account created — check your email to confirm, then sign in.':'Could not sign in');}
    else{syTake(j);await syProfile();syHello();}
  }catch(e){SYS.authErr='No internet connection — you need to be online to sign in the first time.';}
  SYS.authBusy=false;syGate();render();syChip();if(syOK())syNow();
}
async function syProfile(){
  if(!SY.session)return;
  try{const r=await syReq('/rest/v1/profiles?select=*&id=eq.'+SY.session.user.id);if(r.ok){const a=await r.json();if(a[0]){SY.profile=a[0];sySave();}}}catch(e){}
}
function syHello(){ if(SY.profile&&SY.profile.name){DB.staff=SY.profile.name;} }
function syOut(){SY.session=null;SY.profile=null;SY.cursor='';SY.scursor='';SY.pushed={};SY.spushed=0;sySave();SYS.state='idle';render();}
/* ---- change detection ---- */
const SYSEEN={};
function syIndex(){DB.animals.forEach(a=>{SYSEEN[a.id]=JSON.stringify(a);});}
function syScan(){ // called from save(): bump updatedAt on anything edited since last scan
  let ch=false;DB.tombstones=DB.tombstones||[];
  DB.animals.forEach(a=>{const s=JSON.stringify(a);const old=SYSEEN[a.id];
    if(old===undefined){SYSEEN[a.id]=s;return;}
    if(old!==s){const o=JSON.parse(old);const same=JSON.stringify(Object.assign({},o,{updatedAt:0}))===JSON.stringify(Object.assign({},a,{updatedAt:0}));
      if(!same&&a.updatedAt===o.updatedAt){a.updatedAt=Date.now();}
      SYSEEN[a.id]=JSON.stringify(a);ch=true;}});
  const hs=JSON.stringify(DB.settings);if(SY.shash!==undefined&&SY.shash!==hs){DB.settingsUpdatedAt=Date.now();ch=true;}SY.shash=hs;
  if(ch)sySoon();
}
let _syT=null;function sySoon(){if(!syOK())return;clearTimeout(_syT);_syT=setTimeout(syNow,1500);}
/* ---- pull / push ---- */
function syApplyRemote(row){
  const i=DB.animals.findIndex(a=>a.id===row.id);const ru=(row.data&&row.data.updatedAt)||0;
  if(row.deleted){if(i>=0){DB.animals.splice(i,1);if(CUR===row.id)CUR=null;}SY.pushed[row.id]=Number.MAX_SAFE_INTEGER;delete SYSEEN[row.id];return true;}
  if(i<0){DB.animals.push(row.data);SYSEEN[row.id]=JSON.stringify(row.data);SY.pushed[row.id]=ru;return true;}
  if(ru>(DB.animals[i].updatedAt||0)){DB.animals[i]=row.data;SYSEEN[row.id]=JSON.stringify(row.data);SY.pushed[row.id]=ru;return true;}
  if(ru===(DB.animals[i].updatedAt||0)){SY.pushed[row.id]=ru;}
  return false;
}
async function syPull(){
  let changed=false;
  for(let n=0;n<20;n++){
    const q='/rest/v1/animals?select=*&order=updated_at.asc&limit=500'+(SY.cursor?'&updated_at=gt.'+encodeURIComponent(SY.cursor):'');
    const r=await syReq(q);if(!r.ok)throw new Error('pull '+r.status);
    const rows=await r.json();rows.forEach(row=>{if(syApplyRemote(row))changed=true;});
    if(rows.length)SY.cursor=rows[rows.length-1].updated_at;
    if(rows.length<500)break;
  }
  const r2=await syReq('/rest/v1/shared_settings?select=*&id=eq.main');
  if(r2.ok){const a=await r2.json();if(a[0]){const ru=a[0].data.updatedAt||0;
    if(ru>(DB.settingsUpdatedAt||0)){const keep=DB.settings.shelterName;DB.settings=Object.assign(defaultSettings(),a[0].data.settings);DB.settingsUpdatedAt=ru;SY.shash=JSON.stringify(DB.settings);changed=true;}
    SY.spushed=Math.max(SY.spushed||0,Math.min(ru,DB.settingsUpdatedAt||0));}}
  return changed;
}
async function syPush(){
  const tomb=(DB.tombstones||[]);
  const rows=DB.animals.filter(a=>(a.updatedAt||0)>(SY.pushed[a.id]||0)).map(a=>({id:a.id,data:a,deleted:false}));
  tomb.forEach(t=>rows.push({id:t.id,data:{id:t.id,updatedAt:t.at},deleted:true}));
  for(let i=0;i<rows.length;i+=50){
    const part=rows.slice(i,i+50);
    const r=await syReq('/rest/v1/animals?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(part)});
    if(!r.ok)throw new Error('push '+r.status);
    part.forEach(p=>{SY.pushed[p.id]=p.deleted?Number.MAX_SAFE_INTEGER:p.data.updatedAt;});
  }
  if(tomb.length)DB.tombstones=[];
  if(syRole()==='admin'&&(DB.settingsUpdatedAt||0)>(SY.spushed||0)){
    const r=await syReq('/rest/v1/shared_settings?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{id:'main',data:{updatedAt:DB.settingsUpdatedAt,settings:DB.settings}}])});
    if(r.ok)SY.spushed=DB.settingsUpdatedAt;
  }
  sySave();
}
async function syNow(){
  if(!syOn()||!SY.session||SYS.busy)return;
  if(!navigator.onLine){SYS.state='offline';syChip();return;}
  SYS.busy=true;SYS.state='sync';syChip();
  try{
    await syProfile();syGate();
    if(!syOK()){SYS.state='idle';SYS.busy=false;render();return;}
    syHello();
    const ch=await syPull();
    if(ch){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
    await syPush();try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}
    SYS.state='ok';SYS.last=Date.now();SYS.err='';
    if(ch&&!document.querySelector('.modal-bg.open')&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))render();
  }catch(e){SYS.state=navigator.onLine?'err':'offline';SYS.err=String(e.message||e);}
  SYS.busy=false;syChip();
}
function syAgo(){if(!SYS.last)return'';const s=Math.round((Date.now()-SYS.last)/1000);return s<60?'just now':Math.round(s/60)+' min ago';}
function syChip(){
  let c=document.getElementById('syncChip');if(!c){c=document.createElement('div');c.id='syncChip';c.onclick=()=>{VIEW='settings';CUR=null;render();};document.body.appendChild(c);}
  if(!syOn()||!SY.session){c.style.display='none';return;}c.style.display='';
  const m={ok:['☁','Synced '+syAgo(),'ok'],sync:['🔄','Syncing…','sync'],offline:['📴','Offline — saved on this device','off'],err:['⚠️','Sync problem — will retry','err'],idle:['☁',syRole()==='pending'?'Waiting for approval':'Sign-in','off']}[SYS.state]||['☁','','off'];
  c.className='sy-'+m[2];c.innerHTML='<span>'+m[0]+'</span><b>'+m[1]+'</b>';
}
/* ---- login / waiting screens ---- */
function syGate(){
  let g=document.getElementById('syGate');
  const need=syOn()&&(!SY.session||syRole()==='pending'||!SY.profile);
  if(!need){if(g)g.remove();document.body.classList.remove('gate-open');return;}
  if(!g){g=document.createElement('div');g.id='syGate';document.body.appendChild(g);}
  document.body.classList.add('gate-open');
  if(SY.session&&(SY.profile&&SY.profile.role==='pending')){
    g.innerHTML=`<div class="gbox"><div class="paw">🐾</div><h2>Almost there${SY.profile.name?', '+esc(SY.profile.name):''}!</h2><p>Your account (<b>${esc(SY.session.user.email)}</b>) is waiting for an admin to approve it. Once approved you'll see all animals.</p><button class="btn primary" onclick="syCheck()">Check again</button> <button class="btn" onclick="syOut()">Sign out</button></div>`;return;}
  if(SY.session&&!SY.profile){
    g.innerHTML=`<div class="gbox"><div class="paw">🐾</div><h2>Connecting…</h2><p>${navigator.onLine?'Loading your account.':'You are offline. Connect to the internet to finish signing in.'}</p><button class="btn" onclick="syCheck()">Try again</button> <button class="btn" onclick="syOut()">Sign out</button></div>`;return;}
  const up=SYS.mode==='up';
  g.innerHTML=`<form class="gbox" onsubmit="event.preventDefault();syAuth(SYS.mode,this.em.value.trim(),this.pw.value,this.nm?this.nm.value.trim():'')">
    <div class="paw">🐾</div><h2>${up?'Create your login':'Sign in'}</h2><p class="sub">Paws Along the River · shared records</p>
    ${up?'<label class="f">Your name (shown on records)</label><input class="in" name="nm" required autocomplete="name">':''}
    <label class="f">Email</label><input class="in" name="em" type="email" required autocomplete="username">
    <label class="f">Password ${up?'(6+ characters)':''}</label><input class="in" name="pw" type="password" required minlength="6" autocomplete="${up?'new-password':'current-password'}">
    ${SYS.authErr?`<div class="banner lock" style="margin-top:10px">${esc(SYS.authErr)}</div>`:''}
    <button class="btn primary" style="width:100%;margin-top:14px" ${SYS.authBusy?'disabled':''}>${SYS.authBusy?'Please wait…':(up?'Create account':'Sign in')}</button>
    <p class="sub" style="text-align:center;margin-top:12px">${up?'Already have a login? <a href="#" onclick="SYS.mode=\'in\';SYS.authErr=\'\';syGate();return false">Sign in</a>':'New here? <a href="#" onclick="SYS.mode=\'up\';SYS.authErr=\'\';syGate();return false">Create a login</a>'}<br>${up?'An admin has to approve new logins.':''}</p></form>`;
}
async function syCheck(){await syProfile();syGate();render();if(syOK())syNow();}
/* ---- Settings: account + team ---- */
async function syLoadTeam(){try{const r=await syReq('/rest/v1/profiles?select=*&order=created_at.asc');if(r.ok){SYS.team=await r.json();if(VIEW==='settings')render();}}catch(e){}}
async function syRoleSet(id,role){try{const r=await syReq('/rest/v1/profiles?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({role})});if(!r.ok)toast('Could not change role');else toast('Updated');}catch(e){toast('Offline — try again online');}syLoadTeam();}
function syCard(){
  if(!syOn())return '';
  if(!SY.session)return `<div class="card section"><h2>Shared sync</h2><p class="sub">Not signed in.</p></div>`;
  const adm=syRole()==='admin';
  if(adm&&SYS.team===null){SYS.team=[];syLoadTeam();}
  const team=adm&&SYS.team?`<h3 style="margin:16px 0 6px;font-size:15px">Team</h3><div class="sub" style="margin-bottom:6px">Approve new logins here. Staff can edit animals; admins can also change settings and approve people.</div>${SYS.team.map(p=>`<div class="row srow" style="margin-bottom:6px;justify-content:space-between"><div style="min-width:0"><b>${esc(p.name||'')}</b> <span class="sub">${esc(p.email||'')}</span></div>${p.id===SY.session.user.id?'<span class="tag ok">you · '+p.role+'</span>':`<select class="in" style="width:auto" onchange="syRoleSet('${p.id}',this.value)">${['pending','staff','admin'].map(r=>`<option ${p.role===r?'selected':''}>${r}</option>`).join('')}</select>`}</div>`).join('')}`:'';
  return `<div class="card section"><h2>Shared sync</h2>
   <div class="row" style="justify-content:space-between"><div><b>${esc((SY.profile&&SY.profile.name)||'')}</b> <span class="sub">${esc(SY.session.user.email)} · ${syRole()}</span><div class="sub">${SYS.state==='ok'?'Synced '+syAgo():SYS.state==='offline'?'Offline — changes are saved here and will upload when you reconnect':SYS.state==='err'?'Sync problem: '+esc(SYS.err):'…'}</div></div>
   <div class="row"><button class="btn" onclick="syNow()">Sync now</button><button class="btn" onclick="if(confirm('Sign out on this device? Unsynced changes stay saved here.'))syOut()">Sign out</button></div></div>${team}</div>`;
}
/* ---- start ---- */
function syStart(){
  syIndex();SY.shash=JSON.stringify(DB.settings);
  syGate();syChip();
  if(SY.session){syRefresh().then(async ok=>{if(SY.session){await syProfile();}syGate();syChip();if(syOK())syNow();});}
  setInterval(()=>{if(syOK()&&!document.hidden)syNow();syChip();},20000);
  window.addEventListener('online',()=>{syNow();});
  window.addEventListener('offline',()=>{SYS.state='offline';syChip();});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&syOK())syNow();});
}

render();syStart();
</script>
